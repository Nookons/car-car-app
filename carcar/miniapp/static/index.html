<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>CarCar</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <h1 id="screen-title">CarCar</h1>
        <p class="muted" id="screen-subtitle">машины из Польши</p>
      </div>
    </div>
    <button class="icon-btn" id="filters-btn" hidden aria-label="Фильтры">⚙</button>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabbar">
    <a class="tab" href="#/" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      <span>Главная</span>
    </a>
    <a class="tab" href="#/list" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v3H4zm0 5.5h16v3H4zM4 16h10v3H4z"/></svg>
      <span>Список</span>
    </a>
    <a class="tab" href="#/account" data-tab="account">
      <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
      <span>Аккаунт</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <h2 id="sheet-title">Фильтры</h2>
      <button class="icon-btn" id="sheet-close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot">
      <button class="btn ghost" id="sheet-reset">Сбросить</button>
      <button class="btn primary" id="sheet-apply">Показать</button>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
